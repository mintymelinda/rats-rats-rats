services:
  rats-rats-rats:
    build:
      context: .
    image: rats-rats-rats:local
    restart: unless-stopped
    ports:
      - "8080:3000"
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      TWITCH_CHANNEL: "mintymelinda"
      GIF_QUEUE_INTERVAL_MS: "500"
      MOONRAT_DEBUG: "false"
      MOONRAT_TEXT_COLOR: "#fff36b"
      MOONRAT_OUTLINE_COLOR: "#a400a8"
      MOONRAT_GLOW_COLOR: "#fff36b"
      GIF_MAPPINGS: >-
        {
          "mindyfRatNes": {
            "path": "/assets/rat-nes.gif",
            "durationMs": 8000,
            "scale": 2,
            "yOffsetPx": 0,
            "flip": false
          },
          "mindyfRatDos": {
            "path": "/assets/rat-dos.gif",
            "durationMs": 8000,
            "scale": 2,
            "yOffsetPx": 80,
            "flip": false
          },
          "mindyfRatSnes": {
            "path": "/assets/rat-snes.gif",
            "durationMs": 8000,
            "scale": 2,
            "yOffsetPx": 160,
            "flip": false
          }
        }
    volumes:
      - ./assets:/assets:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
